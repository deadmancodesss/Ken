<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/assets/ken-mark.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A link · Ken</title>
    <meta name="description" content="One priced note. The words are held behind a 402 paywall and only come out after the chain says the money arrived." />
    <link rel="stylesheet" href="/theme.css" />
    <script>
      /* The Wallet Standard handshake, done by hand because this page has no bundler.
         A wallet that loads before the page waits for the page to say it is ready; a
         wallet that loads after the page announces itself. Both halves have to be
         answered, and the announcement carries a callback rather than a wallet, so the
         callback has to be called to obtain the wallet at all. Treating the detail as
         already a wallet is how a real extension stays invisible and a page tells a
         person with Slush installed that no wallet exists. */
      window.__walletStandardEarly = [];
      const __wsReady = {
        register: (...ws) => {
          for (const w of ws) if (w && !window.__walletStandardEarly.includes(w)) window.__walletStandardEarly.push(w);
        },
      };
      window.addEventListener("wallet-standard:register-wallet", (e) => {
        const d = e && e.detail;
        if (typeof d === "function") { try { d(__wsReady); } catch {} return; }
        if (d) __wsReady.register(d);
      });
      window.dispatchEvent(new CustomEvent("wallet-standard:app-ready", { detail: __wsReady }));
      if (Array.isArray(navigator.wallets)) navigator.wallets.forEach((cb) => { try { cb(__wsReady); } catch {} });
      else try {
        Object.defineProperty(navigator, "wallets", {
          value: Object.freeze({ push: (...cbs) => cbs.forEach((cb) => { try { cb(__wsReady); } catch {} }) }),
        });
      } catch {}
    </script>
    <script defer src="/vendor/gsap.min.js"></script>
    <style>
      main { flex: 1; overflow-y: auto; padding: 46px var(--pad) 70px; }
      .wrap { max-width: 540px; margin: 0 auto; }

      .offer { border: 1px solid var(--rule-strong); border-radius: 10px; padding: 26px; }
      .offer .label { margin-bottom: 14px; }
      h1 { font: 400 var(--step-3)/1.25 var(--serif); margin: 0 0 14px; letter-spacing: -0.01em; }
      .price { font: 400 var(--step-5)/1.05 var(--serif); letter-spacing: -0.02em; }
      .price small { font-size: var(--step-1); color: var(--ink-2); }
      .who { margin-top: 12px; color: var(--ink-2); font-size: var(--step-0); }
      dl.terms { margin: 20px 0 0; padding-top: 16px; border-top: 1px solid var(--rule); display: grid; gap: 10px; }
      dl.terms > div { display: flex; gap: 14px; align-items: baseline; }
      dl.terms dt { flex: 0 0 104px; font: var(--step--1)/1.4 var(--mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); }
      dl.terms dd { margin: 0; font: var(--step-0)/1.5 var(--mono); word-break: break-all; }

      .actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
      .actions button { flex: 1 1 180px; }
      .stage { margin-top: 18px; font: var(--step--1)/1.6 var(--mono); color: var(--ink-3); }
      .stage b { color: var(--clay); font-weight: 400; }
      .bad { color: var(--brick); }
      .good { color: var(--moss); }

      .note { margin-top: 6px; border: 1px solid var(--moss); border-radius: 10px; padding: 26px; }
      .note .body { white-space: pre-wrap; font: var(--step-0)/1.7 var(--sans); color: var(--ink); }
      .empty { border: 1px dashed var(--rule-strong); border-radius: 10px; padding: 34px; text-align: center; color: var(--ink-3); }
      .empty h2 { font: 400 var(--step-2)/1.4 var(--serif); color: var(--ink); margin: 0 0 10px; }
      .fine { margin-top: 26px; border-top: 1px solid var(--rule); padding-top: 16px; font: var(--step--1)/1.7 var(--mono); color: var(--ink-3); }
    </style>
  </head>
  <body>
                <header>
      <div class="brand">
        <a class="mark" href="/" aria-label="Ken, home"><img src="/assets/ken-mark.svg" width="32" height="32" alt="" /><span class="word">en<i>.</i></span></a>
      </div>
    <nav class="tabs" id="siteMenu" aria-label="Main">
      <div class="navExtra" id="navExtra"></div>
        <a href="/app">Chat</a>
        <a href="/memory">Memory</a>
        <a href="/pay">Pay</a>
        <a href="/request">Request</a>
      <div class="more">
        <button class="moreBtn" type="button" aria-expanded="false" aria-controls="moreMenu" aria-label="More, this page is in the menu">More</button>
        <div class="moreMenu" id="moreMenu" hidden>
          <a href="/ask" aria-current="page">Ask to pay</a>
          <a href="/report">Statement</a>
          <a href="/features">Features</a>
          <a href="/how">How it works</a>
          <a href="/life">In your life</a>
        </div>
      </div>
    </nav>
    <div class="wallet">
      <button class="statusBtn" type="button" aria-expanded="false" aria-controls="statusBox" aria-label="What this page reads">
        <span class="statusDot" aria-hidden="true"></span>
        <span class="statusWord" aria-hidden="true">status</span>
      </button>
      <div class="statusBox" id="statusBox" hidden>
        <div class="statusHead">what this page reads</div>
        <div class="meta">
          <div>chain <b id="chainState">·</b></div>
          <div>brain <b id="model">·</b></div>
        </div>
      </div>
    </div>
      <button class="menuBtn" type="button" data-menu aria-expanded="false" aria-controls="siteMenu" aria-label="Open menu">
        <span class="bars" aria-hidden="true"><i></i><i></i></span>
      </button>
    </header>

    <main>
      <div class="wrap" id="root"><div class="empty">reading the link…</div></div>
    </main>

    <script type="module">
      /* Absolute paths, because this one page is served under /ask/<id> and a relative
         import would look for the script inside the link rather than at the root. */
      import { $, loadMeta, pickWallet, shortAddr, spoken, payNetwork, payChain } from "/shared.js";
      import { signX402, discover } from "/wallet.js";
      import { dialogue, walletAsked, walletFailed } from "/dialogue.js";

      const id = location.pathname.split("/")[2] ?? "";
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

      // Page state rather than server state, because a person opening a link must not
      // change which wallet the rest of the product narrates.
      let payer = null;
      let terms = null;

      const stage = (text, cls = "") => `<div class="stage ${cls}">${text}</div>`;

      function offer(meta, paid) {
        $("root").innerHTML =
          `<div class="offer">
             <div class="label">${meta.from_memory ? "A line out of somebody's memory, priced to read" : "A note that costs money to read"}</div>
             <h1>${esc(meta.title)}</h1>
             <div class="price">${esc(spoken(String(meta.usdc)))} <small>USDC</small></div>
             <div class="who">${meta.opened === 0 ? "Nobody has opened this yet" : `${meta.opened} wallet${meta.opened === 1 ? "" : "s"} paid to open it`}</div>
             <dl class="terms">
               <div><dt>writer</dt><dd>${esc(shortAddr(meta.pay_to))}</dd></div>
               <div><dt>paid on</dt><dd>${esc(terms?.prepared?.chain ?? payChain())}</dd></div>
               ${paid ? `<div><dt>you paid</dt><dd>${esc(paid)}</dd></div>` : ""}
             </dl>
           </div>
           <div class="actions">
             ${
               payer
                 ? `<button class="primary" id="pay">${paid ? "Ask for it again" : `Pay ${esc(spoken(String(meta.usdc)))} USDC`}</button>`
                 : `<button class="primary" id="pick">Connect a wallet to open</button>`
             }
           </div>
           <div class="fine">
             This page has no key of yours. It builds a transaction, your wallet shows you the amount and the address, and
             you approve it there or nothing happens. The words come out of the server only after the receipt has been read
             off the chain, and paying twice is refused by the journal rather than by this page.
           </div>`;

        const pick = $("pick");
        if (pick) {
          const ask = async () => {
            pick.disabled = true;
            const dlg = dialogue(walletAsked(discover().length));
            try {
              const picked = await pickWallet(dlg, (s) => dlg.status(s));
              pick.disabled = false;
              if (picked.chain && !String(picked.chain).toLowerCase().includes(payNetwork())) {
                dlg.replace({
                  tone: "bad",
                  kicker: "the wrong door answered",
                  title: `that account lives on ${picked.chain}`,
                  line: `This link is only paid and checked on Sui ${payNetwork()}, so that account cannot open it from this page.`,
                  beats: [{ text: `it answered with ${shortAddr(picked.address)}`, mark: "dot" }],
                  stamp: "wrong chain",
                  actions: [{ label: "ask again", primary: true, onClick: (d) => { d.close(true); ask(); } }],
                });
                return;
              }
              payer = picked.address;
              dlg.close(true);
              await open();
            } catch (err) {
              pick.disabled = false;
              dlg.replace(walletFailed(err, { seconds: dlg.seconds(), retry: ask }));
            }
          };
          pick.onclick = ask;
        }
        const pay = $("pay");
        if (pay && payer) pay.onclick = () => open(true);
      }

      async function open(pay = false) {
        const listed = await fetch(`/notes?id=${encodeURIComponent(id)}`).then((r) => (r.ok ? r.json() : null));
        const meta = listed?.note;
        if (!meta) {
          $("root").innerHTML =
            `<div class="empty"><h2>Nothing is behind this link</h2><p>Either it was mistyped or the person who wrote it no longer offers it here.</p></div>`;
          return;
        }

        // Nothing is asked of the index until a wallet is in the picture, because the
        // price of a note depends on which wallet is asking.
        if (!payer) {
          offer(meta);
          return;
        }

        let asked = null;
        try {
          const res = await fetch("/ask/sign", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ id, payer }),
          });
          asked = await res.json();
          if (!res.ok && !asked.requirements) throw new Error(asked.error || `the index answered ${res.status}`);
        } catch (err) {
          offer(meta);
          $("root").insertAdjacentHTML("beforeend", stage(esc(err.message), "bad"));
          return;
        }

        if (asked.opened) {
          reveal(meta, asked, asked.tx ? `an earlier signed payment, ${esc(shortAddr(asked.tx))}` : null);
          return;
        }

        // The index quoted above what this agent will pay for one answer. Refusing is a
        // decision, so the page says the price and the ceiling instead of showing a
        // Pay button that would be declined a moment later.
        if (asked.refused) {
          offer(meta);
          $("root").insertAdjacentHTML("beforeend", stage(esc(asked.saying), "bad"));
          return;
        }

        // The index priced the note but could not build a transaction for it, which in
        // practice means a wallet with no USDC on the ledger this note is paid on. Saying
        // that is better than offering a Pay button that fails again two seconds later.
        if (asked.error && !asked.prepared) {
          offer(meta, null);
          $("root").insertAdjacentHTML("beforeend", stage(esc(asked.error), "bad"));
          return;
        }

        terms = asked;
        if (!pay) {
          offer(meta, null);
          $("root").insertAdjacentHTML(
            "beforeend",
            stage(`this wallet has never paid for it · <b>${esc(spoken(String(asked.price_usdc)))} USDC</b> to open`),
          );
          return;
        }

        $("pay").disabled = true;
        $("pay").textContent = "check your wallet…";
        let signed = null;
        try {
          // The wallet signs the exact transfer the index published and sends nothing.
          // The index's facilitator checks the signature and the terms, broadcasts the
          // bytes, and only then releases the words.
          signed = await signX402({ address: payer, chain: asked.prepared.chain, bytesBase64: asked.prepared.bytes });
          $("root").innerHTML = stage("the wallet signed. the index is checking and settling the exact payment…");
        } catch (err) {
          $("pay").disabled = false;
          $("pay").textContent = `Pay ${esc(spoken(String(asked.price_usdc)))} USDC`;
          $("root").insertAdjacentHTML("beforeend", stage(esc(err.message), "bad"));
          return;
        }

        const res = await fetch("/x402/settle", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ resource: `note:${id}`, payer, bytes: signed.bytes, signature: signed.signature, chain: asked.prepared.chain }),
        });
        const back = await res.json();
        if (!res.ok) {
          // Money and words are separate facts, and the page has to say which one it
          // has instead of showing an error that reads like nothing happened. The signed
          // envelope is journalled, so asking again replays it rather than paying twice.
          $("root").innerHTML =
            stage(
              `<b>the signed payment did not come back settled</b> and the index said: ${esc(
                back.error || `it answered ${res.status}`,
              )}. The exact signed transfer is kept, so pressing the button again retries the same payment instead of making a new one.`,
              "bad",
            ) + `<div class="actions"><button id="again" class="primary">Try the same signed payment again</button></div>`;
          $("again").onclick = () => open(true);
          return;
        }
        reveal(meta, back, null);
      }

      function reveal(meta, released, paidBefore) {
        $("root").innerHTML =
          `<div class="note">
             <div class="label good">${released.charged ? `Open, and it cost ${esc(spoken(String(released.charged)))} USDC` : "Open, and this wallet already paid for it"}</div>
             <h1>${esc(meta.title)}</h1>
             <div class="body">${esc(released.fact?.note ?? "(the index handed over nothing to show)")}</div>
           </div>` +
          (paidBefore ? stage(esc(paidBefore)) : "") +
          `<div class="fine">
             ${released.tx ? `Receipt <b>${esc(String(released.tx).slice(0, 14))}…</b> · ` : ""}${esc(shortAddr(meta.pay_to))} was paid.
             Reopen this link from the same wallet as often as you like and it stays free, which is the same rule the agent
             runs its memory on.
           </div>`;
      }

      loadMeta();
      if (!/^[A-Za-z0-9_-]{1,16}$/.test(id)) {
        $("root").innerHTML = `<div class="empty"><h2>That is not a link</h2><p>Nothing after <b>/ask/</b> was a link id.</p></div>`;
      } else {
        await open();
      }
    </script>
  </body>
</html>
